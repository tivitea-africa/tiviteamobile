name: tivi_tea
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.2.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  # flutter_native_splash: ^2.4.1
  go_router: ^14.1.4
  gap: ^3.0.1
  iconsax: ^0.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1
  intl_phone_field: ^3.2.0
  flutter_screenutil: ^5.9.3
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  hive_flutter: ^1.1.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  retrofit: ^4.4.1
  riverpod_annotation: ^2.3.5
  cached_network_image: ^3.4.1
  dotted_border: ^2.1.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  cloudinary_public: ^0.23.1
  adaptive_scrollbar: ^2.1.2
  device_info_plus: ^11.1.1
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  pdf: ^3.11.1
  path_provider: ^2.1.5
  flutter_pdfview: ^1.4.0
  screenshot: ^3.0.0
  uuid: ^4.5.1
  firebase_core: ^3.12.1
  google_sign_in: ^6.2.2
  firebase_auth: ^5.5.1
  package_rename: ^1.10.0
  mobile_scanner: ^6.0.10

# flutter_native_splash:
#   android: true
#   ios: true

#   color: "#FFFFFF"
#   image: "assets/placeholders/logo.png"

dev_dependencies:
  build_runner: ^2.4.11
  flutter_gen_runner:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  retrofit_generator: ^8.0.6
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher-icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/placeholders/

